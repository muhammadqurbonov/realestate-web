<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Green Home Taj — идоракунии эълонҳои амволи ғайриманқул.">

  <!-- Android / Chrome: насби барнома -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1E6FD9">

  <!-- iPhone / iPad: ярлык ба экрани асосӣ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Green Home">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Green Home Taj</title>

  <!-- Ҳодисаи насбро пеш аз боршавии Flutter нигоҳ медорем (барои тугмаи «Барномаро насб кардан») -->
  <script>
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPrompt = e;
    });
    window.addEventListener('appinstalled', function () {
      window.deferredPrompt = null;
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
