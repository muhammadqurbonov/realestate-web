name: realestate_app
description: Барномаи мобилии феҳристи амволи ғайриманқул барои якчанд ширкат (multi-tenant).
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # State management
  provider: ^6.1.2

  # Media
  image_picker: ^1.1.2

  # Маҳаллӣ (забон, огоҳиномаҳои дидашуда)
  shared_preferences: ^2.2.3

  # Formatting
  intl: ^0.19.0

  # Дизайни зебо — шрифт
  google_fonts: ^6.2.1

  # Storage (ройгон, бе Blaze) — Cloudinary
  http: ^1.2.1

  # WhatsApp ва дигар пайвандҳо
  url_launcher: ^6.3.0

  # Фиристодани хона бо аксҳо ҳамчун файл (менюи мубодилаи телефон)
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Иконаи барнома (Android / iOS): dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

# Танзимоти иконаи барнома. Файлҳо дар assets/icon/ ҳастанд.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000A0A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
