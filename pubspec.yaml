name: realestate_app
description: Барномаи мобилии феҳристи амволи ғайриманқул барои якчанд ширкат (multi-tenant).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4

  # State management
  provider: ^6.1.2

  # Media
  image_picker: ^1.0.7

  # Маҳаллӣ (забон, огоҳиномаҳои дидашуда)
  shared_preferences: ^2.2.2

  # Formatting
  intl: ^0.19.0

  # Дизайни зебо — шрифт
  google_fonts: ^6.2.1

  # Storage (ройгон, бе Blaze) — Cloudinary
  http: ^1.2.0

  # WhatsApp ва дигар пайвандҳо
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
